- name: variables from files
  hosts: local
  connection: local
  vars_prompt:
    - name: COURSE
      prompt: please enter course name
      private false: # it is not a Confidential Information
    - name: DURATION
      prompt: Plaese enter Course Duration
      private false:
    - name: TRAINNER
      prompt: please enter course Trainner name
      private false:

  tasks:
    - name: print course information
      ansible.builtin.debug:
        msg: "Course is {{COURSE}},Duration is {{DURATION}} Trainner is {{TRAINNER}}"
